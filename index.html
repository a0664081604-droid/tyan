
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TyanClicker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="game">
        <header>
            <h1>🎮 TyanClicker</h1>
            <p>Добро пожаловать в мир монет!</p>
        </header>

        <div class="stats">
            <h2>🪙 <span id="coins">0</span></h2>
            <p>Уровень: <span id="level">1</span></p>
            <p>За клик: +<span id="power">1</span></p>
        </div>

        <button class="coin" id="clicker">🪙</button>
        <p class="hint">НАЖИМАЙ НА МОНЕТУ!</p>

        <section class="shop">
            <h2>⚡ Магазин</h2>

            <div class="item">
                <div>
                    <b>Усиленный клик</b>
                    <p>+1 монета за нажатие</p>
                    <small>Цена: <span id="price">50</span> 🪙</small>
                </div>
                <button id="buy">Купить</button>
            </div>

            <div class="item">
                <div>
                    <b>Автокликер</b>
                    <p>+1 монета в секунду</p>
                    <small>Цена: <span id="autoPrice">150</span> 🪙</small>
                </div>
                <button id="buyAuto">Купить</button>
            </div>
        </section>

        <footer>
            <button id="bonus">🎁 Ежедневный бонус</button>
            <p>TYANCLICKER © 2026</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
